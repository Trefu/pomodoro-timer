<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0e1d2b" />
  <meta name="description" content="Focus / 25 — an elegant Pomodoro timer for deliberate work." />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <title>Focus / 25 — Pomodoro Timer</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

  <script src="https://cdn.freecodecamp.org/testable-projects-fcc/v1/bundle.js"></script>
  <script>
    (function () {
      var closed = false;

      function closeTestSuite() {
        if (closed) return true;
        var toggle = document.getElementById('fcc_toggle');
        if (!toggle) return false;
        if (toggle.checked) {
          closed = true;
          return true;
        }
        toggle.click();
        if (toggle.checked) {
          closed = true;
          return true;
        }
        try {
          toggle.checked = true;
          toggle.dispatchEvent(new Event('change', { bubbles: true }));
          closed = true;
          return true;
        } catch (err) {
          return false;
        }
      }

      closeTestSuite();
      window.addEventListener('load', closeTestSuite, { once: true });

      var observer = new MutationObserver(function () {
        if (closeTestSuite()) {
          observer.disconnect();
        }
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });

      window.setTimeout(function () {
        observer.disconnect();
      }, 12000);
    })();
  </script>
</body>

</html>
